    <style>
      /* Intro curtain: inlined so it covers the page from the first paint, before any JS or CSS bundle loads. */
      html, body { background: #000; }
      .curtain {
        position: fixed; inset: 0 -40vw 0 -12vw; z-index: 90; display: grid; place-items: center;
        background: #000; transform: translate3d(0, 0, 0) skewX(-12deg); will-change: transform;
        transition: transform .85s cubic-bezier(.7, 0, .3, 1);
        box-shadow: inset 14px 0 0 #ff3348, inset 54px 0 0 #a41e35;
      }
      .curtain__mark {
        padding: .05em .4em; font: 900 clamp(3.5rem, 11vw, 8rem)/1 'Arial Narrow', Impact, sans-serif;
        color: #f3edea; background: #a41e35; transform: skewX(0deg);
        animation: curtain-pulse 1.1s ease-in-out infinite alternate;
      }
      .curtain--go { transform: translate3d(130vw, 0, 0) skewX(-12deg); }
      @keyframes curtain-pulse { from { opacity: .55; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .curtain { display: none; } }
    </style>
  </head>
  <body>
    <div id="curtain" class="curtain" aria-hidden="true"><span class="curtain__mark">AF</span></div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
